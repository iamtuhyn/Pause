<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Loop</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --accent: #6ee7ff; }
  .levels { display: flex; gap: 6px; }
  .levels button {
    font: inherit; font-size: 12px; font-weight: 700; width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer;
  }
  .levels button.cur { border-color: var(--accent); color: var(--text); }
  .levels button.done { color: var(--accent); }
  .levels button:disabled { opacity: .35; cursor: default; }
  .frame { position: relative; }
  .panel {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5, 8, 16, .72); border-radius: var(--radius); backdrop-filter: blur(3px);
  }
  .panel.show { display: flex; }
  .panel .box { text-align: center; padding: 24px; max-width: 420px; }
  .panel h2 { margin: 0 0 6px; font-size: 28px; }
  .panel p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
  .stars { font-size: 30px; letter-spacing: 6px; margin-bottom: 8px; color: var(--accent); }
  .stars .off { color: #2a3348; }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="../index.html">← Arcade</a>
  <h1><span>∞</span> Time Loop</h1>
  <div class="spacer"></div>
  <div class="levels" id="levels"></div>
</header>
<main class="stage">
  <div class="frame">
    <canvas id="c" class="game" width="960" height="540"></canvas>
    <div class="panel" id="panel"><div class="box">
      <div class="stars" id="stars"></div>
      <h2 id="panelTitle">Level clear</h2>
      <p id="panelText"></p>
      <button class="btn primary" id="panelBtn">Next level</button>
    </div></div>
  </div>
  <div class="touch">
    <div class="group"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="group"><button data-k="loop">⟲</button><button data-k="jump">⤒</button></div>
  </div>
  <div class="help">
    <kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>↑</kbd> / <kbd>Space</kbd> jump &nbsp;
    <kbd>R</kbd> end this loop now (your ghost freezes where you stand) &nbsp;
    <kbd>Z</kbd> undo last ghost &nbsp; <kbd>Esc</kbd> restart level
  </div>
</main>

<script src="../shared/award.js"></script>
<script>
(() => {
const T = 30, COLS = 32, ROWS = 18, LOOP_FRAMES = 600;
const PW = 20, PH = 28;
const GRAV = 0.6, JUMP = -9.6, SPEED = 3.4, MAXFALL = 12;
const ACCENT = '#6ee7ff';
const GAME = { gameId: 'time-loop', gameName: 'Time Loop', accent: ACCENT, glyph: '∞' };

// ---------- Levels ----------
// Each builder gets a bordered empty grid; floor is rows 16-17.
function makeGrid() {
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g.push([]);
    for (let c = 0; c < COLS; c++) g[r].push(r === 0 || r >= 16 || c === 0 || c === COLS - 1 ? '#' : '.');
  }
  return g;
}
function rect(g, c1, r1, c2, r2, ch) {
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) g[r][c] = ch;
}

const LEVELS = [
  { name: 'Stand on yourself', par: 2,
    hint: 'The wall is too high. Walk up to it and press R. Next loop, jump on your ghost.',
    build(g) { rect(g, 16, 13, 16, 15, '#'); rect(g, 28, 14, 28, 15, 'E'); return { c: 3, r: 15 }; } },
  { name: 'Hold the door', par: 2,
    hint: 'A plate only opens its door while something stands on it. Something like you.',
    build(g) { g[15][6] = 'a'; rect(g, 20, 1, 20, 15, 'A'); rect(g, 27, 14, 27, 15, 'E'); return { c: 3, r: 15 }; } },
  { name: 'Tower of you', par: 3,
    hint: 'Four tiles high. One ghost isn\'t enough. Stack two.',
    build(g) { rect(g, 16, 12, 16, 15, '#'); rect(g, 28, 14, 28, 15, 'E'); return { c: 3, r: 15 }; } },
  { name: 'Sacrifice', par: 2,
    hint: 'The pit is too wide to jump. Someone has to fall in. Make it a past you.',
    build(g) {
      rect(g, 11, 16, 16, 16, '.'); rect(g, 11, 17, 16, 17, '^');
      rect(g, 28, 14, 28, 15, 'E'); return { c: 4, r: 15 };
    } },
  { name: 'Two keys', par: 3,
    hint: 'Two plates, two doors. The first ghost can also be a step.',
    build(g) {
      g[15][7] = 'a'; rect(g, 8, 13, 11, 15, '#'); g[12][10] = 'b';
      rect(g, 20, 1, 20, 15, 'A'); rect(g, 24, 1, 24, 15, 'B');
      rect(g, 28, 14, 28, 15, 'E'); return { c: 3, r: 15 };
    } },
  { name: 'The relay', par: 4,
    hint: 'Hold the door, cross the gap, build the tower. All in your own company.',
    build(g) {
      g[15][2] = 'a'; rect(g, 10, 1, 10, 15, 'A');
      rect(g, 14, 16, 15, 16, '.'); rect(g, 14, 17, 15, 17, '^');
      rect(g, 22, 12, 22, 15, '#'); rect(g, 28, 14, 28, 15, 'E');
      return { c: 4, r: 15 };
    } },
];

// ---------- Persistence ----------
const SAVE = 'miniArcade.timeLoop.v1';
let progress = { unlocked: 1, best: {} };
try { Object.assign(progress, JSON.parse(localStorage.getItem(SAVE)) || {}); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE, JSON.stringify(progress)); } catch (e) {} }

// ---------- State ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let level = 0, grid, spawn, ghosts, rec, frame, loopNo, player, doors, state, flash = 0;
let runStart = performance.now();

function loadLevel(i) {
  level = i;
  grid = makeGrid();
  spawn = LEVELS[i].build(grid);
  ghosts = [];
  loopNo = 1;
  hidePanel();
  startLoop();
  renderLevelButtons();
}

function startLoop() {
  frame = 0;
  rec = [];
  player = {
    x: spawn.c * T + (T - PW) / 2, y: (spawn.r + 1) * T - PH, vx: 0, vy: 0,
    onGround: false, ground: -1, coyote: 0, face: 1,
  };
  state = 'play';
}

function endLoop() {
  if (rec.length) ghosts.push(rec);
  loopNo++;
  flash = 1;
  startLoop();
}

// ---------- Input ----------
const keys = { left: false, right: false, jump: false };
let jumpBuffer = 0;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' };
window.addEventListener('keydown', (e) => {
  if (Award.isOpen()) return;
  const k = KEYMAP[e.code];
  if (k) {
    if (k === 'jump' && !keys.jump) jumpBuffer = 7;
    keys[k] = true; e.preventDefault();
  }
  if (state === 'won' && (e.code === 'Enter' || e.code === 'Space')) { document.getElementById('panelBtn').click(); return; }
  if (state !== 'play') return;
  if (e.code === 'KeyR') endLoop();
  if (e.code === 'KeyZ' && ghosts.length) { ghosts.pop(); loopNo = Math.max(1, loopNo - 1); startLoop(); }
  if (e.code === 'Escape') loadLevel(level);
});
window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
document.querySelectorAll('.touch button').forEach((b) => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault(); b.classList.add('on');
    if (k === 'loop') { if (state === 'play') endLoop(); return; }
    if (k === 'jump') jumpBuffer = 7;
    keys[k] = true;
  });
  const up = () => { b.classList.remove('on'); if (k !== 'loop') keys[k] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

// ---------- World helpers ----------
const tile = (c, r) => (r < 0 || r >= ROWS || c < 0 || c >= COLS) ? '#' : grid[r][c];
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const box = (b) => ({ x: b.x, y: b.y, w: PW, h: PH });

function ghostPos(g, f) { const p = g[Math.min(f, g.length - 1)]; return { x: p[0], y: p[1], w: PW, h: PH }; }

function computeDoors(bodies) {
  const pressed = {};
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = grid[r][c];
    if (ch >= 'a' && ch <= 'z') {
      const plate = { x: c * T + 2, y: r * T + T - 8, w: T - 4, h: 8 };
      if (bodies.some((b) => overlap(b, plate))) pressed[ch.toUpperCase()] = true;
    }
  }
  // A closing door stays open while someone is standing in it.
  const next = {};
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = grid[r][c];
    if (ch >= 'A' && ch <= 'Z' && ch !== 'E') {
      if (pressed[ch]) next[ch] = true;
      else if (doors && doors[ch]) {
        const d = { x: c * T, y: r * T, w: T, h: T };
        if (bodies.some((b) => overlap(b, d))) next[ch] = true;
      }
    }
  }
  return next;
}

function solidAt(c, r) {
  const ch = tile(c, r);
  if (ch === '#') return true;
  if (ch >= 'A' && ch <= 'Z' && ch !== 'E') return !doors[ch];
  return false;
}

function solidsNear(b, ghostRects) {
  const out = [];
  const c1 = Math.floor(b.x / T) - 1, c2 = Math.floor((b.x + b.w) / T) + 1;
  const r1 = Math.floor(b.y / T) - 1, r2 = Math.floor((b.y + b.h) / T) + 1;
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (solidAt(c, r)) out.push({ x: c * T, y: r * T, w: T, h: T, g: -1 });
  ghostRects.forEach((g, i) => out.push({ ...g, g: i }));
  return out;
}

function moveX(p, dx, ghostRects) {
  p.x += dx;
  for (const s of solidsNear(box(p), ghostRects)) {
    if (!overlap(box(p), s)) continue;
    if (dx > 0) p.x = s.x - PW; else if (dx < 0) p.x = s.x + s.w;
  }
}
function moveY(p, dy, ghostRects) {
  p.y += dy;
  p.onGround = false; p.ground = -1;
  for (const s of solidsNear(box(p), ghostRects)) {
    if (!overlap(box(p), s)) continue;
    if (dy > 0) { p.y = s.y - PH; p.vy = 0; p.onGround = true; p.ground = s.g; }
    else if (dy < 0) { p.y = s.y + s.h; p.vy = 0; }
  }
}

// ---------- Simulation ----------
let prevGhostRects = [];
function step() {
  if (state !== 'play') return;
  const gr = ghosts.map((g) => ghostPos(g, frame));
  doors = computeDoors([...gr, box(player)]);

  const p = player;
  // Ride the ghost we're standing on.
  if (p.ground >= 0 && prevGhostRects[p.ground] && gr[p.ground]) {
    const dx = gr[p.ground].x - prevGhostRects[p.ground].x;
    const dy = gr[p.ground].y - prevGhostRects[p.ground].y;
    p.y += dy;
    if (dx) moveX(p, dx, gr.filter((_, i) => i !== p.ground));
  }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) p.face = dir;
  p.vx = dir * SPEED;
  p.coyote = p.onGround ? 6 : Math.max(0, p.coyote - 1);
  if (jumpBuffer > 0 && p.coyote > 0) { p.vy = JUMP; p.coyote = 0; jumpBuffer = 0; }
  jumpBuffer = Math.max(0, jumpBuffer - 1);
  p.vy = Math.min(MAXFALL, p.vy + GRAV);

  moveX(p, p.vx, gr);
  moveY(p, p.vy, gr);

  // A ghost moved into us: push out along the shallow axis.
  gr.forEach((g, i) => {
    const b = box(p);
    if (!overlap(b, g)) return;
    const ox = Math.min(b.x + b.w - g.x, g.x + g.w - b.x);
    const oy = Math.min(b.y + b.h - g.y, g.y + g.h - b.y);
    if (oy <= ox) {
      if (b.y < g.y) { p.y = g.y - PH; p.vy = 0; p.onGround = true; p.ground = i; }
      else p.y = g.y + g.h;
    } else p.x += b.x < g.x ? -ox : ox;
  });

  prevGhostRects = gr;
  rec.push([p.x, p.y]);
  frame++;

  // Hazards and goal
  const b = box(p);
  for (let r = Math.floor(b.y / T); r <= Math.floor((b.y + b.h) / T); r++) {
    for (let c = Math.floor(b.x / T); c <= Math.floor((b.x + b.w - 1) / T); c++) {
      const ch = tile(c, r);
      if (ch === '^' && overlap(b, { x: c * T + 4, y: r * T + 12, w: T - 8, h: T - 12 })) { burst(p.x + PW / 2, p.y + PH, '#ff5d73'); endLoop(); return; }
      if (ch === 'E' && overlap(b, { x: c * T + 6, y: r * T, w: T - 12, h: T })) { win(); return; }
    }
  }
  if (p.y > ROWS * T) { endLoop(); return; }
  if (frame >= LOOP_FRAMES) endLoop();
}

// ---------- Win / awards ----------
function win() {
  state = 'won';
  burst(player.x + PW / 2, player.y + PH / 2, '#7cffb2');
  const loops = loopNo;
  const L = LEVELS[level];
  const prevBest = progress.best[level];
  if (!prevBest || loops < prevBest) progress.best[level] = loops;
  progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, level + 2));
  persist();
  renderLevelButtons();

  const stars = loops <= L.par ? 3 : loops <= L.par + 1 ? 2 : 1;
  document.getElementById('stars').innerHTML = [0, 1, 2].map((i) => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('');
  document.getElementById('panelTitle').textContent = level === LEVELS.length - 1 ? 'Paradox complete' : 'Level clear';
  document.getElementById('panelText').textContent =
    `You finished in ${loops} loop${loops > 1 ? 's' : ''}.` + (loops > L.par ? ` It can be done in ${L.par}, if you fancy another go.` : '');
  const btn = document.getElementById('panelBtn');
  const last = level === LEVELS.length - 1;
  btn.textContent = last ? 'Play again from level 1' : 'Next level';
  btn.onclick = () => loadLevel(last ? 0 : level + 1);

  setTimeout(() => {
    showPanel();
    checkAwards(loops);
  }, 450);
}

function checkAwards(loops) {
  const totalLoops = Object.values(progress.best).reduce((a, b) => a + b, 0);
  const allDone = LEVELS.every((_, i) => progress.best[i]);
  const allPar = LEVELS.every((L, i) => progress.best[i] && progress.best[i] <= L.par);
  const mins = Math.max(1, Math.round((performance.now() - runStart) / 60000));
  if (level === LEVELS.length - 1 && allPar) {
    Award.unlock({ ...GAME, tier: 'gold', title: 'Master of Paradox',
      line: 'Cleared all 6 levels at par or better.',
      stats: [['Levels', '6 / 6'], ['Best total loops', totalLoops], ['Par total', LEVELS.reduce((a, L) => a + L.par, 0)]] });
  } else if (level === LEVELS.length - 1 && allDone) {
    Award.unlock({ ...GAME, tier: 'silver', title: 'Closed the Loop',
      line: 'Cleared every level in Time Loop.',
      stats: [['Levels', '6 / 6'], ['Total loops', totalLoops], ['Minutes', mins]] });
  } else if (level === 2) {
    Award.unlock({ ...GAME, tier: 'bronze', title: 'Self-Made Ladder',
      line: 'Climbed over a wall made of past selves.',
      stats: [['Levels', '3 / 6'], ['Loops this level', loops], ['Minutes', mins]] });
  }
}

function showPanel() { document.getElementById('panel').classList.add('show'); }
function hidePanel() { document.getElementById('panel').classList.remove('show'); }

function renderLevelButtons() {
  const wrap = document.getElementById('levels');
  wrap.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1;
    b.title = L.name + (progress.best[i] ? ` · best ${progress.best[i]} loops` : '');
    if (i === level) b.classList.add('cur');
    if (progress.best[i]) b.classList.add('done');
    b.disabled = i + 1 > progress.unlocked;
    b.onclick = () => loadLevel(i);
    wrap.appendChild(b);
  });
}

// ---------- Particles ----------
const parts = [];
function burst(x, y, color) {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, color });
  }
}

// ---------- Rendering ----------
function draw(t) {
  const g = ctx.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0, '#0a1024'); g.addColorStop(1, '#070a16');
  ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = 'rgba(110,231,255,0.04)';
  ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(c * T + .5, 0); ctx.lineTo(c * T + .5, cv.height); ctx.stroke(); }
  for (let r = 1; r < ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * T + .5); ctx.lineTo(cv.width, r * T + .5); ctx.stroke(); }

  // Ghost trails
  ghosts.forEach((gh) => {
    ctx.fillStyle = 'rgba(110,231,255,0.07)';
    for (let i = 0; i < gh.length; i += 6) ctx.fillRect(gh[i][0] + PW / 2 - 1, gh[i][1] + PH - 2, 2, 2);
  });

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = grid[r][c], x = c * T, y = r * T;
    if (ch === '#') {
      ctx.fillStyle = '#172038'; ctx.fillRect(x, y, T, T);
      if (tile(c, r - 1) !== '#') { ctx.fillStyle = '#34457a'; ctx.fillRect(x, y, T, 3); }
    } else if (ch === '^') {
      ctx.fillStyle = '#ff5d73';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.moveTo(x + k * 10, y + T); ctx.lineTo(x + k * 10 + 5, y + 12); ctx.lineTo(x + k * 10 + 10, y + T); ctx.fill();
      }
    } else if (ch >= 'a' && ch <= 'z') {
      const on = doors && doors[ch.toUpperCase()];
      ctx.fillStyle = on ? '#ffd166' : '#a8853a';
      if (on) { ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 14; }
      ctx.fillRect(x + 3, y + T - (on ? 4 : 7), T - 6, on ? 4 : 7);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,209,102,.8)'; ctx.font = '700 10px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(ch.toUpperCase(), x + T / 2, y + T - 12);
    } else if (ch >= 'A' && ch <= 'Z' && ch !== 'E') {
      const open = doors && doors[ch];
      if (open) {
        ctx.strokeStyle = 'rgba(255,209,102,.25)'; ctx.setLineDash([4, 4]);
        ctx.strokeRect(x + 8.5, y + .5, T - 17, T - 1); ctx.setLineDash([]);
      } else {
        ctx.fillStyle = '#ffd166'; ctx.fillRect(x + 8, y, T - 16, T);
        ctx.fillStyle = '#b8862a';
        for (let k = 0; k < T; k += 10) ctx.fillRect(x + 8, y + k, T - 16, 4);
      }
    }
  }

  // Exit portal
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (grid[r][c] === 'E' && tile(c, r - 1) !== 'E') {
      let h = 0; while (tile(c, r + h) === 'E') h++;
      const x = c * T, y = r * T, pulse = 0.6 + 0.4 * Math.sin(t / 300);
      ctx.save();
      ctx.shadowColor = '#7cffb2'; ctx.shadowBlur = 24 * pulse;
      ctx.strokeStyle = '#7cffb2'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x + T / 2, y + (h * T) / 2, 11, (h * T) / 2 - 2, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(124,255,178,${0.12 + 0.1 * pulse})`; ctx.fill();
      ctx.restore();
    }
  }

  // Ghosts
  ghosts.forEach((gh, i) => {
    const p = ghostPos(gh, frame);
    const frozen = frame >= gh.length;
    ctx.fillStyle = frozen ? 'rgba(110,231,255,0.22)' : 'rgba(110,231,255,0.35)';
    ctx.strokeStyle = frozen ? 'rgba(110,231,255,0.55)' : 'rgba(110,231,255,0.9)';
    ctx.lineWidth = 1.5;
    roundRect(p.x + .5, p.y + .5, PW - 1, PH - 1, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(220,250,255,.9)'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(frozen ? '❚❚' : String(i + 1), p.x + PW / 2, p.y + PH / 2 + 4);
  });

  // Player
  if (state === 'play' || state === 'won') {
    const p = player;
    ctx.save();
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffffff';
    roundRect(p.x, p.y, PW, PH, 5); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#0a1024';
    const ex = p.x + PW / 2 + p.face * 3;
    ctx.fillRect(ex - 5, p.y + 8, 3, 5); ctx.fillRect(ex + 2, p.y + 8, 3, 5);
  }

  // Particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life -= 0.025;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = q.life; ctx.fillStyle = q.color; ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // HUD: timeline across the ceiling
  const left = 1 - frame / LOOP_FRAMES;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(T, 9, cv.width - 2 * T, 12);
  ctx.fillStyle = left < 0.25 ? '#ff5d73' : ACCENT;
  ctx.fillRect(T, 9, (cv.width - 2 * T) * left, 12);
  ghosts.forEach((gh) => {
    const gx = T + (cv.width - 2 * T) * (1 - Math.min(gh.length, LOOP_FRAMES) / LOOP_FRAMES);
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(gx - 1, 6, 2, 18);
  });

  ctx.textAlign = 'left'; ctx.fillStyle = '#e9ecf5'; ctx.font = '700 16px system-ui';
  ctx.fillText(`${level + 1}. ${LEVELS[level].name}`, T + 6, 56);
  ctx.fillStyle = '#8d94a8'; ctx.font = '500 13px system-ui';
  ctx.fillText(LEVELS[level].hint, T + 6, 76);
  ctx.textAlign = 'right'; ctx.fillStyle = '#e9ecf5'; ctx.font = '700 16px system-ui';
  ctx.fillText(`Loop ${loopNo}  ·  ${(Math.max(0, LOOP_FRAMES - frame) / 60).toFixed(1)}s`, cv.width - T - 6, 56);
  ctx.fillStyle = '#8d94a8'; ctx.font = '500 13px system-ui';
  ctx.fillText(`Par ${LEVELS[level].par}${progress.best[level] ? '  ·  Best ' + progress.best[level] : ''}`, cv.width - T - 6, 76);

  if (flash > 0) {
    ctx.fillStyle = `rgba(110,231,255,${flash * 0.25})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
    flash = Math.max(0, flash - 0.06);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- Loop (fixed 60 Hz step) ----------
let acc = 0, last = performance.now();
function tick(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { if (!Award.isOpen()) step(); acc -= 1000 / 60; }
  draw(now);
  requestAnimationFrame(tick);
}

loadLevel(0);
requestAnimationFrame(tick);
})();
</script>
